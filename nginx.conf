worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off; # Verbirgt die Nginx-Version in Fehlermeldungen

    # 1. Gzip-Komprimierung aktivieren
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Grundlegende Security-Header
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # 2. Direct, un-cached endpoint for Todoist OAuth
        location = /oauth/client.json {
            default_type application/json;
            try_files /oauth/client.json =404;

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header X-Content-Type-Options "nosniff" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # 3. index.html niemals langfristig cachen (verhindert White-Screen nach Updates)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # 4. Versionierte Static Assets (1 Jahr + immutable, OHNE .json)
        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|wasm|woff|woff2|ttf)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable, no-transform" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # 5. Catch-all for React SPA
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}