<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10 propositions · Nouveautés Enhanced for Todoist</title>
<style>
:root{color-scheme:light;--bg:#f4f4f3;--surface:#fff;--subtle:#f7f7f6;--text:#242424;--muted:#737373;--line:#ecebea;--accent:#d1453b;--wash:#faeeec;--blue:#4073ff;--green:#299438;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;padding:30px}button{font:inherit;cursor:pointer;color:inherit}header.intro{max-width:1120px;margin:0 auto 22px;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:22px;letter-spacing:-.03em;margin:0 0 6px}p{line-height:1.6;margin:0;color:var(--muted)}.intro p{font-size:13px}.theme{background:var(--surface);border:1px solid var(--line);padding:9px 14px;border-radius:20px;font-size:12px}
.shell{max-width:1120px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px}.choices{display:flex;flex-direction:column;gap:5px}.choice{display:flex;align-items:center;gap:10px;background:transparent;border:0;text-align:left;border-radius:12px;padding:11px;font-size:13px;color:var(--muted)}.choice span{font-size:11px;width:22px;color:var(--muted)}.choice[aria-pressed=true]{background:var(--surface);box-shadow:0 2px 8px #00000008;color:var(--text);font-weight:600}.choice:hover{background:var(--surface)}
.stage{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 45px #00000006;overflow:hidden}.chrome{display:flex;align-items:center;justify-content:space-between;padding:19px 25px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.chrome strong{color:var(--text);font-weight:500}.close{color:var(--muted);border:0;background:none;font-size:22px}.content{padding:30px 36px 25px;min-height:410px}.eyebrow{font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin-bottom:12px}h2{font-size:30px;line-height:1.12;letter-spacing:-.045em;margin:0 0 14px;font-weight:650}.copy{font-size:14px;max-width:450px;line-height:1.6}.subcopy{font-size:12px;color:var(--muted);margin-top:12px}.icon{display:inline-grid;place-items:center;color:var(--accent);width:48px;height:48px;flex-shrink:0}.icon svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.icon.tile{background:var(--wash);border-radius:13px}.bottom{padding:20px 28px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);gap:18px}.primary{border:0;background:var(--accent);color:#fff;padding:10px 20px;border-radius:25px;font-size:13px;font-weight:600}.quiet{font-size:12px;color:var(--muted);border:0;background:none;padding:0}.minor{margin-top:27px;padding-top:18px;border-top:1px solid var(--line);font-size:12px}.minor summary{cursor:pointer;color:var(--muted);font-size:12px}.minor ul{padding-left:16px;line-height:1.8;color:var(--muted)}.decision{max-width:1120px;margin:18px auto 0;padding-left:258px;font-size:13px;line-height:1.6}.decision b{color:var(--text)}
.preview{border:1px solid var(--line);border-radius:13px;background:var(--surface);overflow:hidden;position:relative}.preview-top{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted)}.preview-top strong{color:var(--text);font-weight:600}.cal{height:215px;display:grid;grid-template-columns:28px repeat(4,1fr);position:relative;background:var(--surface)}.hours{padding-top:29px;display:flex;flex-direction:column;justify-content:space-around;font-size:8px;color:var(--muted);text-align:center}.col{border-left:1px solid var(--line);position:relative;background:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,var(--line) 43px,var(--line) 44px)}.col>small{position:absolute;top:9px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted);background:var(--surface)}.block{position:absolute;left:4px;right:4px;top:55px;height:45px;background:var(--wash);border-radius:5px;padding:6px;color:var(--text);font-size:9px;line-height:1.3;overflow:hidden}.block:before{content:'□';margin-right:3px;color:var(--accent)}.block.blue{background:color-mix(in srgb,var(--blue) 13%,var(--surface))}.block.blue:before{color:var(--blue)}.block.green{background:color-mix(in srgb,var(--green) 12%,var(--surface))}.block.green:before{color:var(--green)}.block time{display:block;color:var(--muted);font-size:8px;margin:2px 0 0 11px}.cal-now{position:absolute;left:28px;right:0;top:132px;height:1px;background:var(--accent)}
.list-preview{padding:13px}.list-preview div{padding:10px 2px;border-bottom:1px solid var(--line);font-size:11px}.list-preview span{color:var(--muted);margin-right:8px}.list-preview small{color:var(--muted);float:right}.stack{display:flex;flex-direction:column;gap:22px}.split{display:grid;grid-template-columns:.95fr 1.05fr;align-items:center;gap:28px}.center{text-align:center}.center .copy{margin:auto}.center .icon{margin-bottom:16px}.apple-feature{display:flex;gap:17px;align-items:flex-start;margin:34px 0 55px}.apple-feature h2{font-size:21px;letter-spacing:-.025em;margin-bottom:9px}.apple-feature .copy{font-size:14px}.feature-banner{padding:22px;border-radius:15px;background:var(--subtle);display:flex;gap:18px;align-items:center}.feature-banner h2{font-size:22px}.big-type h2{font-size:43px;max-width:440px}.big-type .preview{margin-top:26px}.modes{display:inline-flex;background:var(--subtle);padding:3px;border-radius:20px;margin:20px 0 16px}.modes button{border:0;background:none;border-radius:20px;padding:7px 15px;font-size:12px;color:var(--muted)}.modes button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 4px #0001}.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.compare>div>small{display:block;color:var(--muted);font-size:11px;margin:0 0 8px}.compare .list-preview{height:215px}.compare .preview-top{height:35px}.demo-caption{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px;font-size:12px;color:var(--muted)}.smallbutton{border:0;background:var(--subtle);border-radius:16px;padding:8px 12px;font-size:12px}.demo-block{transition:top .5s,height .5s;top:70px;height:42px}.demo-block.moved{top:120px;height:65px}.timeline{border-left:2px solid var(--line);padding-left:24px;position:relative}.timeline:before{content:'';width:10px;height:10px;border-radius:50%;background:var(--accent);position:absolute;left:-6px;top:3px}.timeline .version{font-size:11px;color:var(--muted);margin-bottom:20px}.timeline .preview{margin-top:24px}.compact-row{display:grid;grid-template-columns:1fr 170px;gap:22px;align-items:center;background:var(--subtle);border-radius:14px;padding:23px}.compact-row h2{font-size:23px}.compact-row .cal{height:145px;grid-template-columns:0 repeat(4,1fr)}.compact-row .block{font-size:0}.compact-row .block time{display:none}.compact-row .preview-top{display:none}.compact-row .copy{font-size:13px}.compact-row .icon{margin-bottom:12px}.inset-hero{background:var(--subtle);padding:24px;border-radius:16px}.inset-hero h2{font-size:27px}.inset-hero .preview{margin-top:22px}.page-icon{display:flex;gap:12px;align-items:center;margin-bottom:27px}.page-icon .icon{width:35px;height:35px}.page-icon .icon svg{width:26px;height:26px}.page-icon span{font-size:13px;color:var(--muted)}
.month-demo{height:215px;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(4,1fr);padding:4px}.month-demo div{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px;font-size:8px;color:var(--muted)}.month-demo .mark{background:var(--wash);color:var(--accent);border-radius:4px}.three .col:last-child{display:none}.three{grid-template-columns:28px repeat(3,1fr)}.graphic-rail{display:grid;grid-template-columns:1fr 115px;gap:1px;background:var(--line)}.rail{background:var(--subtle);padding:10px;font-size:9px}.rail b{font-weight:600}.rail-card{background:var(--surface);padding:10px 7px;margin-top:10px;border-radius:7px;line-height:1.4}.rail-card small{display:block;font-size:8px;color:var(--muted);margin-top:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media(max-width:800px){body{padding:16px}.shell{display:block}.choices{flex-direction:row;overflow:auto;margin-bottom:18px}.choice{white-space:nowrap}.choice span{width:auto}.content{padding:25px;min-height:0}.split,.compare,.compact-row{grid-template-columns:1fr}.decision{padding-left:0}.big-type h2{font-size:34px}.intro{align-items:flex-start}.intro h1{font-size:19px}}
</style></head><body>
<header class="intro"><div><h1>Dix façons de présenter la vue Calendrier</h1><p>Enhanced for Todoist · 2.10.0 · Propositions de design, sans modification de la fenêtre actuelle.</p></div><button class="theme" id="theme">Thème sombre</button></header>
<div class="shell"><nav class="choices" aria-label="Propositions" id="choices"></nav><main class="stage"><div class="chrome"><strong>Nouveautés · 2.10.0</strong><span>Enhanced for Todoist</span></div><div class="content" id="content"></div><div class="bottom"><button class="quiet" id="history">Voir l’historique</button><button class="primary" id="try">Découvrir le calendrier</button></div></main></div><div class="decision" id="decision" aria-live="polite"></div>
<script>
const icon='<span class="icon"><svg viewBox="0 0 32 32"><rect x="5" y="7" width="22" height="21" rx="4"/><path d="M11 4v6m10-6v6M5 14h22m-16 5h2m5 0h2m-9 5h2m5 0h2"/></svg></span>';
const title='Votre semaine prend forme.';
const copy='La nouvelle vue Calendrier vous permet de planifier sur 3 jours, une semaine ou un mois. Glissez vos tâches dans un créneau et ajustez leur durée directement dans le calendrier.';
const minor='<details class="minor"><summary>Historique · 2.9.0</summary><ul><li>Assignation en tapant + dans le titre.</li><li>Sous-tâches en langage naturel.</li><li>Une fenêtre de partage plus complète.</li><li>Titres plus longs sur les cartes du tableau.</li></ul></details>';
function calendar(mode='week',interactive=false){if(mode==='month')return '<div class="preview"><div class="preview-top"><strong>Octobre 2026</strong><span>Mois</span></div><div class="month-demo">'+Array.from({length:28},(_,i)=>'<div class="'+([9,14,18,22].includes(i)?'mark':'')+'">'+(i+1)+([9,14,18,22].includes(i)?'<br>Réunion':'')+'</div>').join('')+'</div></div>';return '<div class="preview"><div class="preview-top"><strong>Octobre 2026</strong><span>'+(mode==='3'?'3 jours':'Semaine')+'</span></div><div class="cal '+(mode==='3'?'three':'')+'"><div class="hours"><span>09:00</span><span>10:00</span><span>11:00</span><span>12:00</span></div>'+['Lun. 12','Mar. 13','Mer. 14','Jeu. 15'].map((day,i)=>'<div class="col"><small>'+day+'</small>'+(i===0?'<div class="block blue">Préparer le brief<time>09:30 · 45 min</time></div>':i===1?'<div class="block '+(interactive?'demo-block':'')+'" style="'+(!interactive?'top:99px;height:68px':'')+'">Refonte du site<time>10:30 · 1 h</time></div>':i===2?'<div class="block green" style="top:60px;height:28px">Appeler le garage</div>':'<div class="block blue" style="top:146px;height:40px">Faire le point</div>')+'</div>').join('')+'<div class="cal-now"></div></div></div>'}
const variants=[
{name:'Apple classique',why:'La plus proche de votre référence : une icône, un titre et un paragraphe. Simple à maintenir pour chaque grande nouveauté.',html:()=>'<div class="eyebrow">Nouveau dans Enhanced for Todoist</div><h2>Une autre façon de planifier.</h2><div class="apple-feature">'+icon+'<div><h2>La vue Calendrier</h2><p class="copy">'+copy+'</p></div></div>'+minor},
{name:'Aperçu en premier',why:'La fonctionnalité se comprend avant de lire. Le meilleur choix si chaque grande nouveauté peut avoir une capture dédiée.',html:()=>'<div class="stack">'+calendar()+'<div><div class="eyebrow">Nouvelle vue</div><h2>'+title+'</h2><p class="copy">'+copy+'</p></div></div>'+minor},
{name:'Texte et démonstration',why:'Mon choix pour cette release : le bénéfice à gauche, le calendrier à droite. Une nouveauté, une image et une action.',html:()=>'<div class="split"><div><div class="eyebrow">La vue Calendrier</div><h2>'+title+'</h2><p class="copy">'+copy+'</p></div>'+calendar()+'</div>'+minor},
{name:'Carte avec le panneau Sans date',why:'Un seul bloc éditorial, avec une vue qui montre ce qui distingue ce calendrier : les tâches sans date restent à portée de main.',html:()=>'<div class="inset-hero"><div class="eyebrow">Une nouvelle vue, les mêmes tâches</div><h2>Une place pour ce qui compte.</h2><p class="copy">'+copy+'</p><div class="preview"><div class="graphic-rail"><div>'+calendar()+'</div><aside class="rail"><b>Sans date · 2</b><div class="rail-card">Choisir les images<small>30 min</small></div><div class="rail-card">Préparer le devis<small>45 min</small></div></aside></div></div></div>'+minor},
{name:'Éditorial',why:'Plus affirmée, avec un grand titre. À réserver aux changements structurants pour garder leur importance.',html:()=>'<div class="big-type"><div class="eyebrow">La vue Calendrier est arrivée</div><h2>Moins de listes.<br>Plus de perspective.</h2><p class="copy">'+copy+'</p>'+calendar()+'</div>'+minor},
{name:'Trois présentations à explorer',why:'Les boutons changent la prévisualisation. Cela montre les trois présentations tout en annonçant une seule fonctionnalité.',html:()=>'<div class="center"><div class="eyebrow">La vue Calendrier</div><h2>Choisissez votre perspective.</h2><p class="copy">'+copy+'</p><div class="modes" role="group" aria-label="Présentation"><button data-mode="3" aria-pressed="false">3 jours</button><button data-mode="week" aria-pressed="true">Semaine</button><button data-mode="month" aria-pressed="false">Mois</button></div></div><div id="mode-preview">'+calendar()+'</div>'+minor},
{name:'Liste et calendrier',why:'Les deux vues côte à côte expliquent le choix disponible. À privilégier pour présenter un nouveau mode de lecture.',html:()=>'<div class="eyebrow">La vue Calendrier</div><h2>Vos tâches, sous un autre angle.</h2><p class="copy">La liste reste là. Le calendrier vous aide à leur donner une place dans la semaine.</p><div class="compare"><div><small>Liste</small><div class="preview"><div class="preview-top"><strong>Cette semaine</strong></div><div class="list-preview"><div><span>□</span>Préparer le brief<small>45 min</small></div><div><span>□</span>Refonte du site<small>1 h</small></div><div><span>□</span>Appeler le garage<small>30 min</small></div></div></div></div><div><small>Calendrier</small>'+calendar()+'</div></div>'+minor},
{name:'Démonstration animée',why:'Un exemple animé explique le déplacement et le redimensionnement. Le mouvement ne part que sur demande.',html:()=>'<div class="eyebrow">La vue Calendrier</div><h2>Planifiez d’un geste.</h2><p class="copy">Déplacez une tâche et ajustez sa durée directement dans le calendrier.</p><div style="margin-top:24px">'+calendar('week',true)+'</div><div class="demo-caption"><span id="demo-caption">Une tâche, un créneau, une estimation.</span><button class="smallbutton" id="animate">Voir le geste</button></div>'+minor},
{name:'Fil des versions',why:'Une nouveauté mise en avant dans un historique continu. Utile pour consulter plusieurs releases sans ouvrir plusieurs fenêtres.',html:()=>'<div class="timeline"><div class="version">16 octobre 2026 · Version 2.10.0</div><div class="eyebrow">La vue Calendrier</div><h2>'+title+'</h2><p class="copy">'+copy+'</p>'+calendar()+minor+'</div>'},
{name:'Bannière compacte',why:'La plus discrète : elle introduit la nouveauté sans prendre toute la place. Bien adaptée à une fenêtre d’historique existante.',html:()=>'<div class="page-icon">'+icon+'<span>Les nouveautés d’Enhanced for Todoist</span></div><div class="compact-row"><div><div class="eyebrow">Nouveau · Calendrier</div><h2>Donnez une place à vos tâches.</h2><p class="copy">Planifiez sur 3 jours, une semaine ou un mois, puis ajustez vos créneaux par glisser-déposer.</p></div>'+calendar()+'</div>'+minor}
];
const choices=document.getElementById('choices'),content=document.getElementById('content'),decision=document.getElementById('decision');
function show(index){content.innerHTML=variants[index].html();decision.innerHTML='<b>'+variants[index].name+'.</b> '+variants[index].why;choices.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));content.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{content.querySelector('#mode-preview').innerHTML=calendar(button.dataset.mode);content.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));const animate=content.querySelector('#animate');if(animate)animate.addEventListener('click',()=>{const moved=content.querySelector('.demo-block').classList.toggle('moved');content.querySelector('#demo-caption').textContent=moved?'La tâche change de créneau et son estimation suit.':'Une tâche, un créneau, une estimation.';animate.textContent=moved?'Rejouer':'Voir le geste'});}
variants.forEach((variant,i)=>{const button=document.createElement('button');button.className='choice';button.innerHTML='<span>'+String(i+1).padStart(2,'0')+'</span>'+variant.name;button.addEventListener('click',()=>show(i));choices.append(button)});show(2);
document.getElementById('theme').addEventListener('click',()=>{const dark=document.documentElement.style.colorScheme!=='dark';document.documentElement.style.cssText=dark?'color-scheme:dark;--bg:#161616;--surface:#222;--subtle:#2b2b2b;--text:#ededed;--muted:#a1a1a1;--line:#363636;--wash:#452b29;':'';document.getElementById('theme').textContent=dark?'Thème clair':'Thème sombre'});
document.getElementById('history').addEventListener('click',()=>{const history=content.querySelector('details');if(history){history.open=!history.open;history.scrollIntoView({behavior:'smooth',block:'nearest'})}});
document.getElementById('try').addEventListener('click',()=>{decision.textContent='Exemple de bouton : dans l’app, il ouvre la vue Calendrier. Choisissez la proposition que vous préférez.'});
</script></body></html>
